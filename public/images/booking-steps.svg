<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'IBM Plex Sans Thai','Noto Sans Thai',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f7f2"/>
      <stop offset="1" stop-color="#e6f0e6"/>
    </linearGradient>
    <style>
      .card { fill: #ffffff; stroke: #d9e6d5; stroke-width: 2; }
      .num { fill: #2f6b4f; }
      .numtext { fill: #ffffff; font-weight: 700; font-size: 22px; }
      .title { fill: #1f3236; font-weight: 700; font-size: 19px; }
      .desc { fill: #6b7d70; font-size: 14px; }
      .arrow { stroke: #a9c9a3; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="420" fill="url(#bg)"/>

  <text x="600" y="48" text-anchor="middle" class="title" font-size="26">🏕️ ขั้นตอนการจอง Chill Doi Camping &amp; Farm</text>
  <text x="600" y="76" text-anchor="middle" class="desc" font-size="15">จองง่าย สะดวก รวดเร็ว ใน 5 ขั้นตอน</text>

  <!-- connecting arrows -->
  <path class="arrow" d="M 218 210 H 262" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 448 210 H 492" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 678 210 H 722" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 908 210 H 952" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a9c9a3"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(20,110)">
    <rect class="card" x="0" y="0" width="200" height="200" rx="20"/>
    <circle class="num" cx="30" cy="30" r="20"/>
    <text x="30" y="38" text-anchor="middle" class="numtext">1</text>
    <text x="100" y="90" text-anchor="middle" font-size="44">📅</text>
    <text x="100" y="135" text-anchor="middle" class="title">เลือกที่พัก</text>
    <text x="100" y="157" text-anchor="middle" class="desc">และวันที่เข้าพัก</text>
    <text x="100" y="176" text-anchor="middle" class="desc">ระบบเช็คห้องว่างให้ทันที</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(250,110)">
    <rect class="card" x="0" y="0" width="200" height="200" rx="20"/>
    <circle class="num" cx="30" cy="30" r="20"/>
    <text x="30" y="38" text-anchor="middle" class="numtext">2</text>
    <text x="100" y="90" text-anchor="middle" font-size="44">📝</text>
    <text x="100" y="135" text-anchor="middle" class="title">กรอกข้อมูลจอง</text>
    <text x="100" y="157" text-anchor="middle" class="desc">ชื่อ เบอร์โทร อีเมล</text>
    <text x="100" y="176" text-anchor="middle" class="desc">เลือกกิจกรรม/บริการเสริมได้</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(480,110)">
    <rect class="card" x="0" y="0" width="200" height="200" rx="20"/>
    <circle class="num" cx="30" cy="30" r="20"/>
    <text x="30" y="38" text-anchor="middle" class="numtext">3</text>
    <text x="100" y="90" text-anchor="middle" font-size="44">✅</text>
    <text x="100" y="135" text-anchor="middle" class="title">ยืนยันคำขอจอง</text>
    <text x="100" y="157" text-anchor="middle" class="desc">ระบบขึ้นสถานะ</text>
    <text x="100" y="176" text-anchor="middle" class="desc">"รอยืนยัน" ทันที</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(710,110)">
    <rect class="card" x="0" y="0" width="200" height="200" rx="20"/>
    <circle class="num" cx="30" cy="30" r="20"/>
    <text x="30" y="38" text-anchor="middle" class="numtext">4</text>
    <text x="100" y="90" text-anchor="middle" font-size="44">💳</text>
    <text x="100" y="135" text-anchor="middle" class="title">ชำระเงิน</text>
    <text x="100" y="157" text-anchor="middle" class="desc">โอนตามบัญชีที่แจ้ง</text>
    <text x="100" y="176" text-anchor="middle" class="desc">แนบสลิปผ่านหน้าเว็บ</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(940,110)">
    <rect class="card" x="0" y="0" width="200" height="200" rx="20"/>
    <circle class="num" cx="30" cy="30" r="20"/>
    <text x="30" y="38" text-anchor="middle" class="numtext">5</text>
    <text x="100" y="90" text-anchor="middle" font-size="44">📧</text>
    <text x="100" y="135" text-anchor="middle" class="title">รอรับอีเมล</text>
    <text x="100" y="157" text-anchor="middle" class="desc">ยืนยันการจอง</text>
    <text x="100" y="176" text-anchor="middle" class="desc">จากเจ้าหน้าที่</text>
  </g>

  <text x="600" y="400" text-anchor="middle" class="desc" font-size="13">🌿 ChillDoi Camping &amp; Farm — ใกล้ชิดธรรมชาติ ไกลจากความวุ่นวาย</text>
</svg>
